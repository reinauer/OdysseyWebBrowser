<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>PROGDIR:Fonts</dir>
  <dir>FONTS:_TrueType</dir>
  <cachedir>T:fontconfig</cachedir>
  <!-- Running each glyph's TrueType instructions cost up to 31% of a
       text-heavy page's load time on a 68040. Unhinted 16 px text differs
       only in edge pixels. See Tools/AmigaOS3/OPTIMIZATIONS.md. -->
  <match target="font">
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
  </match>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Noto Sans</family><family>DejaVu Sans</family></prefer>
  </alias>
  <config><rescan><int>30</int></rescan></config>
</fontconfig>
